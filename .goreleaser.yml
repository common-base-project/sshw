# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

project_name: sshw

builds:
  - binary: sshw

    main: ./cmd/sshw/main.go
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Build={{.Version}}

    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
      - mips
      - mipsle
      - mips64
      - mips64le
    goarm:
      - "7"
      - "6"
    gomips:
      - hardfloat
      - softfloat

    ignore:
      - goos: darwin
        goarch: "386"

archives:
  - id: sshw
    name_template: "{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}{{ if .Mips }}_{{ .Mips }}{{ end }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
